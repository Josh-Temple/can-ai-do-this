<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AIで実際に何ができるかを、公式情報と利用条件つきで確認する質問ページ。">
  <title>Can AI Do This?</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead question-masthead">
    <div class="wrap">
      <a class="back-link" href="./">← 一覧へ戻る</a>
      <p class="eyebrow">CAN AI DO THIS? / QUESTION</p>
      <p id="question-meta" class="question-id">読み込み中…</p>
      <h1 id="question-title" class="question-page-title">質問を読み込んでいます</h1>
      <div id="question-badge" class="question-page-badge"></div>
    </div>
  </header>

  <main class="wrap question-page">
    <section aria-label="回答">
      <div id="question-answers"></div>
      <p id="question-community" class="community" hidden></p>
    </section>

    <section class="related-section" aria-labelledby="related-heading">
      <p class="section-kicker">RELATED</p>
      <h2 id="related-heading" class="section-title">関連する質問</h2>
      <ul id="related-list" class="related-list"></ul>
    </section>

    <div id="question-error" class="error" hidden>
      <p>質問を読み込めませんでした。</p>
      <p class="muted"><a href="./">一覧から探し直す</a></p>
    </div>
  </main>

  <footer class="wrap footer">
    <p>
      AIの機能は変化します。回答には確認日・条件・根拠を付けています。
    </p>
    <p>
      <a href="https://github.com/Josh-Temple/can-ai-do-this">データと調査方法をGitHubで見る</a>
    </p>
  </footer>

  <script src="./question.js" defer></script>
</body>
</html>
