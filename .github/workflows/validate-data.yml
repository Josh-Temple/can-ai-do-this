name: Validate capability data

on:
  push:
    paths:
      - "data/questions/**"
      - "schemas/**"
      - "scripts/validate_records.py"
      - "scripts/build_site.py"
      - "scripts/check_search_cases.py"
      - "scripts/check_freshness.py"
      - "scripts/check_source_watch.py"
      - "scripts/check_usability_assets.py"
      - "site/**"
      - "tests/fixtures/**"
      - "tests/search-cases.json"
      - "monitoring/source-watch.json"
      - ".github/workflows/source-watch.yml"
      - ".github/workflows/validate-data.yml"
      - ".github/workflows/freshness-watch.yml"
      - ".github/workflows/feedback-triage.yml"
      - "research/USABILITY_TEST_PROTOCOL_2026-10-03.md"
      - "research/usability-results/TEMPLATE.md"
  pull_request:
    paths:
      - "data/questions/**"
      - "schemas/**"
      - "scripts/validate_records.py"
      - "scripts/build_site.py"
      - "scripts/check_search_cases.py"
      - "scripts/check_freshness.py"
      - "scripts/check_source_watch.py"
      - "scripts/check_usability_assets.py"
      - "site/**"
      - "tests/fixtures/**"
      - "tests/search-cases.json"
      - "monitoring/source-watch.json"
      - ".github/workflows/source-watch.yml"
      - ".github/workflows/validate-data.yml"
      - ".github/workflows/freshness-watch.yml"
      - ".github/workflows/feedback-triage.yml"
      - "research/USABILITY_TEST_PROTOCOL_2026-10-03.md"
      - "research/usability-results/TEMPLATE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate canonical question records
        run: python scripts/validate_records.py

      - name: Confirm valid fixture passes
        run: python scripts/validate_records.py tests/fixtures/valid-question.json

      - name: Confirm invalid fixture fails
        shell: bash
        run: |
          if python scripts/validate_records.py tests/fixtures/invalid-question.json; then
            echo "Invalid fixture unexpectedly passed validation."
            exit 1
          fi
          echo "Invalid fixture failed as expected."

      - name: Confirm semantic-invalid evidence fixture fails
        shell: bash
        run: |
          if python scripts/validate_records.py tests/fixtures/invalid-evidence-question.json; then
            echo "Semantic-invalid evidence fixture unexpectedly passed validation."
            exit 1
          fi
          echo "Semantic-invalid evidence fixture failed as expected."

      - name: Confirm VERIFIED documentation reread fixture passes
        run: python scripts/validate_records.py tests/fixtures/valid-verified-doc-reread-question.json

      - name: Confirm VERIFIED direct-test freshness fails closed
        shell: bash
        run: |
          if python scripts/validate_records.py tests/fixtures/invalid-verified-refresh-question.json; then
            echo "VERIFIED fixture incorrectly refreshed from documentation."
            exit 1
          fi
          echo "VERIFIED direct-test freshness failed closed as expected."

      - name: Check usability protocol/template alignment
        run: python scripts/check_usability_assets.py

      - name: Check browser JavaScript syntax
        run: |
          node --check site/freshness.js
          node --check site/feedback.js
          node --check site/app.js
          node --check site/question.js
      - name: Check public feedback URL handling
        run: |
          node - <<'NODE'
          const assert = require("node:assert");
          const { cleanPageUrl, buildFeedbackIssueUrl } = require("./site/feedback.js");

          assert.equal(
            cleanPageUrl("https://example.test/?q=private+search&product=ChatGPT#results"),
            "https://example.test/"
          );
          assert.equal(
            cleanPageUrl("https://example.test/question.html?slug=sample&q=private#answer"),
            "https://example.test/question.html?slug=sample"
          );

          const issueUrl = new URL(buildFeedbackIssueUrl({
            outcome: "見つからなかった",
            intent: "PDFを比較したい",
            confusion: "検索で見つからない",
            context: {
              questionId: "Q0049",
              questionTitle: "Sample question",
              pageUrl: "https://example.test/question.html?slug=sample",
            },
          }));
          assert.equal(issueUrl.hostname, "github.com");
          assert.equal(issueUrl.pathname, "/Josh-Temple/can-ai-do-this/issues/new");
          assert.match(issueUrl.searchParams.get("title"), /^\[Site feedback\] Q0049/);
          assert.match(issueUrl.searchParams.get("body"), /PDFを比較したい/);
          assert(!issueUrl.searchParams.get("body").includes("private search"));
          console.log("Public feedback URL checks passed.");
          NODE

      - name: Check public freshness boundary
        run: |
          node - <<'NODE'
          const assert = require("node:assert");
          const freshness = require("./site/freshness.js");
          const record = { review_window_days: 14 };
          const answer = { last_checked: "2026-10-03" };

          const before = freshness.evaluate(record, answer, new Date("2026-10-16T12:00:00Z"));
          assert.equal(before.isDue, false);
          assert.equal(before.nextReview, "2026-10-17");

          const due = freshness.evaluate(record, answer, new Date("2026-10-17T00:00:00Z"));
          assert.equal(due.isDue, true);
          assert.equal(due.state, "DUE");

          const multi = freshness.recordStatus(
            { review_window_days: 14, answers: [
              { last_checked: "2026-10-03" },
              { last_checked: "2026-10-10" }
            ]},
            new Date("2026-10-17T00:00:00Z")
          );
          assert.equal(multi.dueCount, 1);
          console.log("Public freshness boundary checks passed.");
          NODE

      - name: Check task-search regressions
        run: python scripts/check_search_cases.py

      - name: Smoke-test freshness policy
        shell: bash
        run: |
          python scripts/check_freshness.py tests/fixtures/valid-question.json --as-of 2026-10-31 --fail-on-due
          if python scripts/check_freshness.py tests/fixtures/valid-question.json --as-of 2026-11-01 --fail-on-due; then
            echo "Freshness checker unexpectedly treated the due date as current."
            exit 1
          fi
          echo "Freshness due-date boundary failed as expected."

      - name: Confirm answer-level freshness is fail-closed
        shell: bash
        run: |
          if python scripts/check_freshness.py tests/fixtures/freshness-answer-level-question.json --as-of 2026-10-16 --fail-on-due; then
            echo "Record-level last_checked incorrectly hid an answer due for review."
            exit 1
          fi
          echo "Answer-level due-date boundary failed closed as expected."

      - name: Lint source-watch coverage
        run: python scripts/check_source_watch.py --lint-only

      - name: Check source-watch token boundaries
        run: |
          python - <<'PY'
          from scripts.check_source_watch import anchor_present, normalize
          assert not anchor_present(normalize("product pricing"), "pro")
          assert not anchor_present(normalize("program"), "pr")
          assert anchor_present(normalize("Pro plan"), "pro")
          assert anchor_present(normalize("open a PR"), "pr")
          print("Source-watch token boundary checks passed.")
          PY

      - name: Confirm clean source-watch fixture passes
        run: >-
          python scripts/check_source_watch.py
          --config tests/fixtures/source-watch-config.json
          --content-map tests/fixtures/source-watch-content-ok.json
          --skip-coverage

      - name: Confirm configured source relocation passes
        run: >-
          python scripts/check_source_watch.py
          --config tests/fixtures/source-watch-config.json
          --content-map tests/fixtures/source-watch-content-relocated.json
          --skip-coverage

      - name: Confirm semantic source change fails
        shell: bash
        run: |
          if python scripts/check_source_watch.py --config tests/fixtures/source-watch-config.json --content-map tests/fixtures/source-watch-content-changed.json --skip-coverage; then
            echo "Changed source fixture unexpectedly passed."
            exit 1
          fi
          echo "Changed source fixture failed as expected."

      - name: Confirm unreadable HTTP 200 fails closed
        shell: bash
        run: |
          if python scripts/check_source_watch.py --config tests/fixtures/source-watch-config.json --content-map tests/fixtures/source-watch-content-unreadable.json --skip-coverage; then
            echo "Unreadable HTTP 200 fixture unexpectedly passed."
            exit 1
          fi
          echo "Unreadable HTTP 200 fixture failed closed as expected."

      - name: Confirm transient source failure does not create semantic failure
        run: >-
          python scripts/check_source_watch.py
          --config tests/fixtures/source-watch-config.json
          --content-map tests/fixtures/source-watch-content-transient.json
          --skip-coverage

      - name: Build static site from canonical records
        run: python scripts/build_site.py --output /tmp/can-ai-do-this-site

      - name: Check site artifact
        shell: bash
        run: |
          test -s /tmp/can-ai-do-this-site/index.html
          test -s /tmp/can-ai-do-this-site/questions.json
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("/tmp/can-ai-do-this-site/questions.json").read_text())
          assert records, "questions.json is empty"
          assert all("id" in record and "answers" in record for record in records)
          print(f"Site artifact contains {len(records)} records")
          PY
