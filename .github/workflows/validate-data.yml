name: Validate capability data

on:
  push:
    paths:
      - "data/questions/**"
      - "schemas/**"
      - "scripts/validate_records.py"
      - "scripts/build_site.py"
      - "site/**"
      - "tests/fixtures/**"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/questions/**"
      - "schemas/**"
      - "scripts/validate_records.py"
      - "scripts/build_site.py"
      - "site/**"
      - "tests/fixtures/**"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate canonical question records
        run: python scripts/validate_records.py

      - name: Confirm valid fixture passes
        run: python scripts/validate_records.py tests/fixtures/valid-question.json

      - name: Confirm invalid fixture fails
        shell: bash
        run: |
          if python scripts/validate_records.py tests/fixtures/invalid-question.json; then
            echo "Invalid fixture unexpectedly passed validation."
            exit 1
          fi
          echo "Invalid fixture failed as expected."

      - name: Build static site from canonical records
        run: python scripts/build_site.py --output /tmp/can-ai-do-this-site

      - name: Check site artifact
        shell: bash
        run: |
          test -s /tmp/can-ai-do-this-site/index.html
          test -s /tmp/can-ai-do-this-site/questions.json
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("/tmp/can-ai-do-this-site/questions.json").read_text())
          assert records, "questions.json is empty"
          assert all("id" in record and "answers" in record for record in records)
          print(f"Site artifact contains {len(records)} records")
          PY
