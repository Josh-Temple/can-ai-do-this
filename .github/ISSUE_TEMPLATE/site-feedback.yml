name: Site feedback
description: Tell us whether you found the answer you were looking for.
title: "[Site feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Can AI Do This?. Please do not include your name, email address, account identifiers, or private conversation content.
  - type: dropdown
    id: outcome
    attributes:
      label: Did you find the answer you were looking for?
      options:
        - Found it
        - Partly found it
        - Did not find it
    validations:
      required: true
  - type: input
    id: intent
    attributes:
      label: What were you trying to do?
      placeholder: Example: Compare which AI can understand charts inside a PDF
    validations:
      required: false
  - type: input
    id: question
    attributes:
      label: Question ID, if applicable
      placeholder: Example: Q0049
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page URL, if applicable
      placeholder: https://josh-temple.github.io/can-ai-do-this/
    validations:
      required: false
  - type: textarea
    id: confusion
    attributes:
      label: What was unclear?
      description: Search, wording, conditions, evidence, comparison, navigation, or anything else.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include personal or private information.
          required: true
